name: Flutter CI

on:
  push:
    branches: [ "feat/core-features-and-offline-db" ]
  pull_request:
    branches: [ "feat/core-features-and-offline-db" ]

jobs:
  build_android_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "11.x"
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk
      - uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - run: flutter build web
      - uses: actions/upload-artifact@v3
        with:
          name: web-build
          path: build/web

  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build ios --no-codesign